---
# ==============================================================================
# Playbook: Retrieve and Configure Admin Kubeconfig (03-fetch-kubeconfig.yml)
# ==============================================================================

- name: Retrieve Kubeconfig to Local Management Machine
  hosts: kube_control_plane[0]
  become: true
  tasks:
    - name: Check if admin.conf exists on control plane
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Ensure local artifacts directory exists
      ansible.builtin.file:
        path: "{{ artifacts_dir | default(playbook_dir ~ '/../artifacts') }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false

    - name: Fetch admin.conf to local workstation artifacts
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ artifacts_dir | default(playbook_dir ~ '/../artifacts') }}/admin.conf"
        flat: true
      when: k8s_admin_conf.stat.exists

    - name: Update server IP in local admin.conf to public IP of master
      delegate_to: localhost
      become: false
      ansible.builtin.replace:
        path: "{{ artifacts_dir | default(playbook_dir ~ '/../artifacts') }}/admin.conf"
        regexp: 'https://127.0.0.1:6443'
        replace: "https://{{ ansible_host }}:6443"
      when: k8s_admin_conf.stat.exists

    - name: Ensure local ~/.kube directory exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: '0755'
      when: k8s_admin_conf.stat.exists

    - name: Copy cluster admin.conf to local ~/.kube/config
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        src: "{{ artifacts_dir | default(playbook_dir ~ '/../artifacts') }}/admin.conf"
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: '0600'
      when: k8s_admin_conf.stat.exists
