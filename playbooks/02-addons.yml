---
# ==============================================================================
# Playbook: Deploy Kubernetes Add-ons & Workloads (02-addons.yml)
# Executes on the Primary Control Plane Node (Master 01)
# ==============================================================================

- name: Deploy Kubernetes Add-ons & Workloads
  hosts: kube_control_plane[0]
  become: true
  gather_facts: true
  roles:
    - role: traefik
    - role: cert_manager
    - role: headlamp
    - role: argocd
    - role: react_app
