apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-app-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/keoKAY/devoops12-shortcourse-weekend.git
    targetRevision: HEAD
    path: 7.kubernetes/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
