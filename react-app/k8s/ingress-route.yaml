apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: react-app-ingressroute
  namespace: production
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`react.dara.lifestyle`)
      kind: Rule
      services:
        - name: react-app-svc
          port: 80
  tls:
    secretName: react-app-tls-cert
