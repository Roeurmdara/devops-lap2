name: React.js CI/CD Pipeline (GitOps & ArgoCD)

on:
  push:
    branches:
      - main
    paths:
      - 'react-app/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dara-lifestyle-react
  GITOPS_REPO: ${{ github.repository }}
  APP_DIR: react-app

jobs:
  # ============================================================================
  # Stage 1: Lint, Test, and Build React Application
  # ============================================================================
  test-and-build:
    name: Build & Test React.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-app/package.json

      - name: Install Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci || npm install

      - name: Run Tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      - name: Build Production Assets
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

  # ============================================================================
  # Stage 2: Build & Push Docker Container Image
  # ============================================================================
  docker-build-push:
    name: Build & Push Container Image
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: GitOps Manifest Update & ArgoCD Auto-Sync
  # ============================================================================
  gitops-deploy:
    name: Update GitOps Manifest & Sync ArgoCD
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Deployment Image Tag in Kubernetes Manifest
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          echo "Updating deployment to $NEW_IMAGE..."

          # Update in manifests directory
          sed -i "s|image: .*dara-lifestyle-react:.*|image: ${NEW_IMAGE}|g" manifests/react-app/deployment.yaml 2>/dev/null || true
          sed -i "s|image: nginx:alpine|image: ${NEW_IMAGE}|g" manifests/react-app/deployment.yaml 2>/dev/null || true

      - name: Commit & Push GitOps Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/react-app/deployment.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "ci(gitops): update react-app image to ${{ github.sha }} [skip ci]"
            git push
          fi
