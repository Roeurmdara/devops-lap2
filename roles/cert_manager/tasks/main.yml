---
# ==============================================================================
# Role Tasks: Deploy Cert-Manager and ClusterIssuer
# ==============================================================================

- name: Create cert-manager namespace
  ansible.builtin.command: kubectl create namespace cert-manager
  register: create_ns_cert_manager
  failed_when: create_ns_cert_manager.rc != 0 and "already exists" not in create_ns_cert_manager.stderr
  changed_when: create_ns_cert_manager.rc == 0

- name: Add Jetstack Helm repository
  ansible.builtin.command: helm repo add jetstack https://charts.jetstack.io
  changed_when: false

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Deploy cert-manager with CRDs enabled
  ansible.builtin.command: >
    helm upgrade --install cert-manager jetstack/cert-manager
    --namespace cert-manager
    --set crds.enabled=true
    --wait
    --timeout 5m
  register: helm_certmanager_result
  changed_when: "'Release \"cert-manager\" does not exist' in helm_certmanager_result.stdout or 'STATUS: deployed' in helm_certmanager_result.stdout"

- name: Wait for cert-manager webhook to become ready
  ansible.builtin.command: >
    kubectl wait --namespace cert-manager
    --for=condition=ready pod
    --selector=app.kubernetes.io/component=webhook
    --timeout=120s
  changed_when: false

- name: Render ClusterIssuer manifest
  ansible.builtin.template:
    src: clusterissuer.yaml.j2
    dest: /tmp/clusterissuer.yaml
    mode: '0644'

- name: Apply Let's Encrypt ClusterIssuer
  ansible.builtin.command: kubectl apply -f /tmp/clusterissuer.yaml
  register: apply_clusterissuer
  changed_when: "'configured' in apply_clusterissuer.stdout or 'created' in apply_clusterissuer.stdout"

- name: Verify cert-manager pods status
  ansible.builtin.command: kubectl get pods -n cert-manager -o wide
  register: cert_manager_pods
  changed_when: false

- name: Display Cert-Manager Pod Status
  ansible.builtin.debug:
    var: cert_manager_pods.stdout_lines
